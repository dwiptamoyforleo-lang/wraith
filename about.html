<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Story — WRAITH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FDE6F0;
    --ink: #241C2C;
    --muted: #756981;
    --accent: #A3197B;
    --line: #F2C4DC;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  body{
    background: linear-gradient(120deg, #FDE6F0, #FAC1DE, #FDE6F0);
    background-size: 200% 200%;
    animation: heroFlow 14s ease-in-out infinite;
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  @keyframes heroFlow{
    0%, 100%{ background-position: 0% 50%; }
    50%{ background-position: 100% 50%; }
  }
  @media (prefers-reduced-motion: reduce){
    body{ animation: none; background-position: 50% 50%; }
  }
  a{ color: inherit; text-decoration: none; }
  .wrap{ max-width: 1180px; margin: 0 auto; padding: 0 28px; width: 100%; }
  header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 0;
    border-bottom: 1px solid var(--line);
  }
  .logo{ font-family: 'Anton'; font-size: 26px; letter-spacing: 0.02em; }
  .back{
    font-size: 14px;
    color: var(--muted);
    border: 1px solid var(--line);
    padding: 8px 16px;
    transition: color .15s, border-color .15s;
  }
  .back:hover{ color: var(--accent); border-color: var(--accent); }
  main{
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 80px 28px;
  }
  main h1{
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    font-size: clamp(48px, 9vw, 96px);
    line-height: 0.95;
  }
  main p{
    color: var(--muted);
    font-size: 15px;
    margin-top: 18px;
  }
  footer{
    padding: 30px 0;
    border-top: 1px solid var(--line);
    font-size: 13px;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>

  <div class="wrap">
    <header>
      <a href="index.html" class="logo">WRAITH</a>
      <a href="index.html" class="back">Back to shop</a>
    </header>
  </div>

  <main>
    <div>
      <h1>Coming soon...</h1>
      <p>Our story is still being written.</p>
    </div>
  </main>

  <div class="wrap">
    <footer>© 2026 WRAITH. All rights reserved.</footer>
  </div>

</body>
</html>
